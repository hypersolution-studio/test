version: '3.8'

services:
  # API de Imóveis
  api-imoveis:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api-imoveis
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_APP=api_imoveis_exemplo.py
    volumes:
      - ./api_imoveis_exemplo.py:/app/api_imoveis_exemplo.py
    networks:
      - imobiliaria-network
    restart: unless-stopped

  # n8n - Automação de Workflows
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-imobiliaria
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n-data:/home/node/.n8n
      - ./whatsapp-imobiliaria-flow.json:/data/whatsapp-imobiliaria-flow.json
    networks:
      - imobiliaria-network
    restart: unless-stopped

  # MongoDB (opcional - para persistência de dados)
  mongodb:
    image: mongo:7
    container_name: mongodb-imobiliaria
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=imobiliaria
    volumes:
      - mongodb-data:/data/db
    networks:
      - imobiliaria-network
    restart: unless-stopped

  # Redis (opcional - para cache e sessões)
  redis:
    image: redis:7-alpine
    container_name: redis-imobiliaria
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - imobiliaria-network
    restart: unless-stopped

  # PostgreSQL - Banco de dados para Evolution API
  postgres:
    image: postgres:15-alpine
    container_name: postgres-evolution
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - imobiliaria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Evolution API - WhatsApp Integration
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Configurações básicas
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=Change-Me-12345-Secret-Key-Here
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # Configurações de armazenamento
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true

      # Redis para cache e sessões
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true

      # Configurações de Webhook Global
      - WEBHOOK_GLOBAL_ENABLED=false
      - WEBHOOK_GLOBAL_URL=http://n8n:5678/webhook/whatsapp-webhook
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true

      # Configurações de QR Code
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#175197

      # Configurações de logs
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      - LOG_COLOR=true
      - LOG_BAILEYS=error

      # Configurações de instância
      - DEL_INSTANCE=false
      - DEL_TEMP_INSTANCES=true

      # Configurações de autenticação
      - AUTHENTICATION_TYPE=apikey

      # Configurações de integração
      - CONFIG_SESSION_PHONE_CLIENT=Evolution API
      - CONFIG_SESSION_PHONE_NAME=Chrome

    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - imobiliaria-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

networks:
  imobiliaria-network:
    driver: bridge

volumes:
  n8n-data:
  mongodb-data:
  redis-data:
  postgres_data:
  evolution_instances:
  evolution_store:
